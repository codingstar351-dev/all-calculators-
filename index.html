<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1ea">
    <meta name="description" content="A clean, responsive calculator with an interactive collection.">
    <title>Calculator</title>
  </head>
  <body>
    <noscript>This calculator requires JavaScript.</noscript>
    <script>
      fetch('site.b64', { cache: 'no-cache' })
        .then((response) => { if (!response.ok) throw new Error('Unable to load calculator'); return response.text(); })
        .then((encoded) => {
          const bytes = Uint8Array.from(atob(encoded.trim()), (character) => character.charCodeAt(0));
          const documentSource = new TextDecoder().decode(bytes);
          document.open(); document.write(documentSource); document.close();
        })
        .catch(() => { document.body.textContent = 'Calculator unavailable. Please refresh.'; });
    </script>
  </body>
</html>
